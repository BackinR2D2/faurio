name: Verify public Faurio deployment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    if: ${{ vars.FAURIO_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run test:production
        env:
          FAURIO_URL: ${{ vars.FAURIO_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-smoke-evidence
          path: playwright-report/production/
